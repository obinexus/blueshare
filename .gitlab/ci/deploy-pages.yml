blueshare:deploy-pages:
  extends: .blueshare-python-job
  stage: deploy
  needs:
    - job: blueshare:build-pages
      artifacts: true
  script:
    - python .gitlab/scripts/package_pages.py --verify-only --output public --base-path "$BLUESHARE_PAGES_BASE_PATH"
  pages: true
  environment:
    name: pages/production
    url: "$BLUESHARE_CANONICAL_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
