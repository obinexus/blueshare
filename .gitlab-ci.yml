stages:
  - validate
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  BLUESHARE_PAGES_BASE_PATH: "/blueshare"
  BLUESHARE_CANONICAL_URL: "https://www.obinexus.org/blueshare/"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

include:
  - local: "/.gitlab/ci/quality.yml"
  - local: "/.gitlab/ci/build-pages.yml"
  - local: "/.gitlab/ci/deploy-pages.yml"
