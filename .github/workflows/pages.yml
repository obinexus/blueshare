name: Publish BlueShare to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - README3.md
      - docs/blog/images/**
      - output/pdf/blueshare-sharing-moments-matters.pdf
      - .gitlab/pages/**
      - .gitlab/scripts/package_pages.py
      - .gitlab/tests/test_package_pages.py
      - .github/actions/build-pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out BlueShare
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}

      - name: Build BlueShare Pages
        uses: ./.github/actions/build-pages
        with:
          output-directory: _site
          canonical-url: https://obinexus.github.io/blueshare/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
