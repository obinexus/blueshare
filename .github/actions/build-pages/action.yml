name: Build BlueShare Pages
description: Test and package the static BlueShare article for GitHub Pages.

inputs:
  output-directory:
    description: Repository-relative directory that receives the Pages artifact.
    required: false
    default: _site
  canonical-url:
    description: Public canonical URL written into the generated HTML.
    required: true

runs:
  using: composite
  steps:
    - name: Test the shared Pages packager
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: python -m unittest discover -s .gitlab/tests -v

    - name: Build the GitHub Pages artifact
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: >-
        python .gitlab/scripts/package_pages.py
        --output "${{ inputs.output-directory }}"
        --base-path /
        --canonical-url "${{ inputs.canonical-url }}"

    - name: Verify the complete artifact
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: >-
        python .gitlab/scripts/package_pages.py
        --output "${{ inputs.output-directory }}"
        --base-path /
        --verify-only
